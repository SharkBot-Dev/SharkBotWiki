<h1>モデレーター</h1>
<p>モデレーター機能を使用するとモデレーターのためのコマンドが追加されます。</p>
<h2>処罰コマンド</h2>
<p>処罰に使用できるコマンドは以下の通りです。</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td>コマンド名</td>
        <td>説明</td>
      </tr>
      <tr>
        <td><code>/ban</code>, <code>/moderation&nbsp;ban</code></td>
        <td>指定したユーザーをBanします。</td>
      </tr>
      <tr>
        <td><code>/kick</code>, <code>/moderation&nbsp;kick</code></td>
        <td>指定したメンバーをKickします。</td>
      </tr>
      <tr>
        <td><code>/moderation&nbsp;unban</code></td>
        <td>指定したユーザーのBanを解除します。</td>
      </tr>
      <tr>
        <td><code>/moderation&nbsp;silentban</code></td>
        <td>メッセージを削除せずに指定したメンバーをBanします。</td>
      </tr>
      <tr>
        <td><code>/moderation&nbsp;softban</code></td>
        <td>指定したメンバーを一瞬Banして解除します。</td>
      </tr>
      <tr>
        <td><code>/moderation&nbsp;massban</code></td>
        <td>指定したユーザーリストを一括banします。</td>
      </tr>
      <tr>
        <td><code>/moderation&nbsp;timeout</code></td>
        <td>指定したメンバーをタイムアウトします。</td>
      </tr>
      <tr>
        <td><code>/moderation untimeout</code></td>
        <td>指定したメンバーのタイムアウトを解除します。</td>
      </tr>
      <tr>
        <td><code>/moderation max-timeout</code></td>
        <td>指定したメンバーを最大までタイムアウトします。</td>
      </tr>
      <tr>
        <td><code>/clear, /moderation clear</code></td>
        <td>メッセージをまとめて削除します。</td>
      </tr>
      <tr>
        <td><code>/moderation warn</code></td>
        <td>指定したメンバーを警告します。</td>
      </tr>
      <tr>
        <td><code>/moderation warns</code></td>
        <td>指定したメンバーの警告数を取得します。</td>
      </tr>
      <tr>
        <td><code>/moderation remake</code></td>
        <td>実行したチャンネルを再生成します。</td>
      </tr>
      <tr>
        <td><code>/moderation lock</code></td>
        <td>実行したチャンネルを封鎖します。</td>
      </tr>
      <tr>
        <td><code>/moderation unlock</code></td>
        <td>実行したチャンネルを解放します。</td>
      </tr>
      <tr>
        <td><code>/moderation report</code></td>
        <td>通報チャンネルをセットアップします。</td>
      </tr>
      <tr>
        <td><code>/moderation serverban</code></td>
        <td>指定したサーバーに参加しているユーザーをWeb認証で弾くようにします。</td>
      </tr>
      <tr>
        <td><code>/moderation serverunban</code></td>
        <td>指定したサーバーに参加しているユーザーをWeb認証で弾くのを解除します。</td>
      </tr>
      <tr>
        <td><code>/moderation auditlog</code></td>
        <td>監査ログをダンプします。</td>
      </tr>
      <tr>
        <td><code>/moderation lottery</code></td>
        <td>指定したものから抽選します。</td>
      </tr>
      <tr>
        <td><code>/moderation panel</code></td>
        <td>簡単モデレーションパネルを表示します。</td>
      </tr>
      <tr>
        <td><code>/note set</code></td>
        <td>モデレーターの設定できるノートを設定します。</td>
      </tr>
      <tr>
        <td><code>/note remove</code></td>
        <td>モデレーターの設定できるノートを削除します。</td>
      </tr>
      <tr>
        <td><code>/note get</code></td>
        <td>モデレーターの設定できるノートを取得します。</td>
      </tr>
      <tr>
        <td><code>/moderation pause invite</code></td>
        <td>サーバーの招待リンクを無効にします。</td>
      </tr>
    </tbody>
  </table>
</figure>
<p>&nbsp;</p>

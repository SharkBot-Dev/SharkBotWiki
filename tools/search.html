<h1>検索</h1>
<p>検索機能を使用することでインターネット上の情報や、Discordユーザー、サーバーの情報を取得したりできます。</p>
<h2>Discordの情報を検索する</h2>
<p>Discordの情報は、以下のコマンドで検索できます。</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td>コマンド名</td>
        <td>説明</td>
      </tr>
      <tr>
        <td><code>/search user</code>, <code>/user</code></td>
        <td>ユーザー情報を検索します。</td>
      </tr>
      <tr>
        <td><code>/search server</code>, <code>/server</code></td>
        <td>サーバー情報を取得します。</td>
      </tr>
      <tr>
        <td><code>/search tag</code></td>
        <td>特定のサーバータグをつけている人と数を取得します。</td>
      </tr>
      <tr>
        <td><code>/search channel</code></td>
        <td>チャンネルを検索します。</td>
      </tr>
      <tr>
        <td><code>/search ban</code></td>
        <td>サーバーBanされたユーザーと理由を検索します。</td>
      </tr>
      <tr>
        <td><code>/search bot</code></td>
        <td>Botを導入した時刻と誰が導入したかを検索します。</td>
      </tr>
      <tr>
        <td><code>/search invite</code></td>
        <td>サーバー招待リンクを検索します。</td>
      </tr>
      <tr>
        <td><code>/search avatar</code></td>
        <td>指定した人のアバターを表示します。</td>
      </tr>
      <tr>
        <td><code>/search banner</code></td>
        <td>指定した人バナーを表示します。</td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
      </tr>
    </tbody>
  </table>
</figure>

<h1>検索</h1>
<p>検索機能を使用することでインターネット上の情報や、Discordユーザー、サーバーの情報を取得したりできます。</p>
<h2>Discordの情報を検索する</h2>
<p>Discordの情報は、以下のコマンドで検索できます。</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td>コマンド名</td>
        <td>説明</td>
      </tr>
      <tr>
        <td><code>/search user</code>, <code>/user</code></td>
        <td>ユーザー情報を検索します。</td>
      </tr>
      <tr>
        <td><code>/search server</code>, <code>/server</code></td>
        <td>サーバー情報を取得します。</td>
      </tr>
      <tr>
        <td><code>/search tag</code></td>
        <td>特定のサーバータグをつけている人と数を取得します。</td>
      </tr>
      <tr>
        <td><code>/search channel</code></td>
        <td>チャンネルを検索します。</td>
      </tr>
      <tr>
        <td><code>/search ban</code></td>
        <td>サーバーBanされたユーザーと理由を検索します。</td>
      </tr>
      <tr>
        <td><code>/search bot</code></td>
        <td>Botを導入した時刻と誰が導入したかを検索します。</td>
      </tr>
      <tr>
        <td><code>/search invite</code></td>
        <td>サーバー招待リンクを検索します。</td>
      </tr>
      <tr>
        <td><code>/search avatar</code></td>
        <td>指定した人のアバターを表示します。</td>
      </tr>
      <tr>
        <td><code>/search banner</code></td>
        <td>指定した人バナーを表示します。</td>
      </tr>
      <tr>
        <td>&nbsp;<code>/search emoji</code></td>
        <td>絵文字の情報を取得します。</td>
      </tr>
      <tr>
        <td><code>/search spotify</code></td>
        <td>Spotifyで聞いている音楽を取得します。</td>
      </tr>
      <tr>
        <td><code>/search game</code></td>
        <td>指定した人の遊んでいるゲームを取得します。</td>
      </tr>
      <tr>
        <td><code>/search snowflake</code></td>
        <td>Snowflakeの情報を取得します。</td>
      </tr>
      <tr>
        <td><code>/search message</code></td>
        <td>実行したチャンネルで送信したメッセージを取得します。</td>
      </tr>
      <tr>
        <td><code>/search color</code></td>
        <td>指定したユーザーの色を表示します。</td>
      </tr>
      <tr>
        <td><code>/search badge</code></td>
        <td>指定したユーザーのバッジを表示します。</td>
      </tr>
    </tbody>
  </table>
</figure>
<h2>インターネット上の情報を検索する</h2>
<p>インターネット上の情報は以下のコマンドで検索できます。</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td>コマンド名</td>
        <td>説明</td>
      </tr>
      <tr>
        <td><code>/search web translate</code></td>
        <td>テキストを翻訳します。</td>
      </tr>
      <tr>
        <td><code>/search web news</code></td>
        <td>最新のニュースを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web wikipedia</code></td>
        <td>Wikipediaを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web safeweb</code></td>
        <td>URLが安全かどうかを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web anime</code></td>
        <td>アニメを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web manga</code></td>
        <td>漫画を検索します。</td>
      </tr>
      <tr>
        <td><code>/search web youtube</code></td>
        <td>Youtubeを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web niconico</code></td>
        <td>ニコニコ動画を検索します。</td>
      </tr>
      <tr>
        <td><code>/search web discord</code></td>
        <td>Discordのバグを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web iss</code></td>
        <td>国際宇宙ステーションの位置を検索します。</td>
      </tr>
      <tr>
        <td><code>/search web note</code></td>
        <td>Noteを検索します。</td>
      </tr>
      <tr>
        <td><code>/search web today</code></td>
        <td><a href="/tools/today">毎日の記念日</a>を取得します。（<a href="/premium">👑メンバーシップが必要</a>）</td>
      </tr>
    </tbody>
  </table>
</figure>

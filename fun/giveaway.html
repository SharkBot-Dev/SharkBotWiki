<h1>プレゼント配布</h1>
<p>プレゼント配布機能を使用するとプレゼントを受け取る人を抽選し、簡単に配布できます。</p>
<h2>プレゼント配布を開催する</h2>
<p><code>/giveaway create</code>で開催できます。</p>
<p>景品は自由に設定でき、サーバー内経済のコインやアイテムを指定したり、レベルのXPを指定したりできます。</p>
<p>景品名だけ指定した場合は、Botが自動で付与することはありません。</p>
<h2>プレゼント配布を終了する</h2>
<p>「終了する」ボタンで終了され、自動で抽選されます。</p>
<p>その後、抽選で当たった人が通知されます。</p>
<h2>プレゼントを再抽選する</h2>
<p>再抽選を行う場合は、終了後に「再抽選」ボタンを押すことで簡単に再抽選できます。</p>

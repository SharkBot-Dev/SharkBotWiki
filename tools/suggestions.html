<h1>提案</h1>
<p>提案機能を使用すると、サーバーに提案ができ、メンバーやモデレーターに賛成か、反対かをアンケートで集計することができます。</p>
<h2>提案をセットアップする</h2>
<p><code>/suggestions setting </code>を提案した内容を表示したいチャンネルで実行します。</p>
<p>また、このタイミングで可決、否決に必要な票の数を指定できます。</p>
<h2>提案を送信する</h2>
<p><code>/suggetions send</code>で提案を送信できます。</p>
<p>送信すると、以下のメッセージが作成されます。</p>
<figure class="image"><img src="/suggestions_send.png"></figure>
<p>👍、👎で投票ができ、（権限不要）</p>
<p>✅で強制可決、❌で強制否決ができます。（管理者権限が必要）</p>
<figure class="image"><img src="/suggestions_deny.png"></figure>

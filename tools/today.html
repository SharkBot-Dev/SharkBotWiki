<h1>毎日の記念日 (<a href="/premium">👑メンバーシップが必要</a>)</h1>
<p>毎日の記念日を購読することで、メンバーが毎日の記念日を知ることができるようになります。</p>
<h2>毎日の記念日を購読する</h2>
<p><code>/settings today enable </code>で購読できます。</p>
<p>午前0時に毎日通知されます。</p>
<p><code>/settings today disable</code>で購読を解除できます。</p>
<h2>毎日の記念日を手動で取得する</h2>
<p><code>/search web today</code>で取得できます。</p>

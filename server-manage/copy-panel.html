<h1>他のBotからコピー</h1>
<p>SharkBotは他のBotからパネルをコピーすることが可能です。</p>
<h2>コピーをする</h2>
<p><code>/panel copy</code>でコピーを行えます。</p>
<p>「メッセージ」にはコピーを行うパネルを選択してください。</p>
<h2>対応しているBot一覧</h2>
<ul>
  <li>役職パネルv4様 （役職パネル全般をコピーできます。）</li>
</ul>
<h2>どのようにコピーされますか？</h2>
<p>リアクション、ボタンを使用したパネルはボタンとしてコピーされます。</p>
<p>また、埋め込みはSharkBot用に改変されてコピーされます。</p>

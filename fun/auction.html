<h1>オークション</h1>
<p>オークション機能を使用するとサーバー内でのオークションを簡単に開催できます。</p>
<h2>オークションを開催する</h2>
<p><code>/panel auction</code>でオークションを作成できます。</p>
<h2>オークションに入札する</h2>
<p>「入札する」ボタンで入札できます。</p>
<h2>オークションを終了する</h2>
<p>「終了する」ボタンで終了でき、落札した人が表示されます。</p>

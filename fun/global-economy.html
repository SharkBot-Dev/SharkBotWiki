<h1>グローバル経済</h1>
<p>サーバー内経済とは別にグローバル経済が存在します。</p>
<h2>グローバル経済アカウントを作成する</h2>
<p><code>/account create</code>で作成できます。</p>
<h2>稼ぐコマンドを実行してコインを入手する</h2>
<p><code>/account work</code>で稼げます。</p>
<h2>現在のステータスをランキングを取得する</h2>
<p><code>/account status</code>でステータスを取得でき、</p>
<p><code>/account leaderboard</code>でランキングを取得できます。</p>
<h2>定期リセットについて</h2>
<p>グローバル経済は定期的にリセットされます。</p>
<p>ご了承ください。</p>
